<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xadrez Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>♟</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== TELA: LOBBY ========== -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-container">
      <div class="logo">
        <span class="logo-icon">♟</span>
        <h1>Xadrez Online</h1>
        <p>Jogo de xadrez em tempo real</p>
      </div>

      <!-- Seleção de modo -->
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="multiplayer">
          <span class="mode-icon">👥</span>
          <span class="mode-label">Multijogador</span>
          <span class="mode-desc">Jogue contra um amigo online</span>
        </button>
        <button class="mode-btn" data-mode="ai">
          <span class="mode-icon">🤖</span>
          <span class="mode-label">vs Computador</span>
          <span class="mode-desc">Jogue contra a IA</span>
        </button>
      </div>

      <!-- Painel Multijogador -->
      <div id="panel-multiplayer" class="mode-panel">
        <button id="btn-create" class="btn btn-primary btn-full">Criar Partida</button>
        <div class="divider"><span>ou entre em uma sala</span></div>
        <div class="join-group">
          <input id="input-room" type="text" placeholder="Código da sala" maxlength="6" autocomplete="off" />
          <button id="btn-join" class="btn btn-secondary">Entrar</button>
        </div>
      </div>

      <!-- Painel IA -->
      <div id="panel-ai" class="mode-panel hidden">
        <div class="ai-options">

          <div class="option-group">
            <label class="option-label">Jogar como</label>
            <div class="color-selector">
              <button class="color-btn active" data-color="w">
                ♙ Brancas
              </button>
              <button class="color-btn" data-color="random">
                🎲 Aleatório
              </button>
              <button class="color-btn" data-color="b">
                ♟ Pretas
              </button>
            </div>
          </div>

          <div class="option-group">
            <label class="option-label">Dificuldade</label>
            <div class="difficulty-selector">
              <button class="diff-btn" data-level="iniciante">
                <span class="diff-name">Iniciante</span>
                <span class="diff-desc">Para aprender</span>
                <div class="diff-stars">★☆☆☆</div>
              </button>
              <button class="diff-btn active" data-level="intermediario">
                <span class="diff-name">Intermediário</span>
                <span class="diff-desc">Desafiador</span>
                <div class="diff-stars">★★☆☆</div>
              </button>
              <button class="diff-btn" data-level="avancado">
                <span class="diff-name">Avançado</span>
                <span class="diff-desc">Difícil</span>
                <div class="diff-stars">★★★☆</div>
              </button>
              <button class="diff-btn" data-level="expert">
                <span class="diff-name">Expert</span>
                <span class="diff-desc">Implacável</span>
                <div class="diff-stars">★★★★</div>
              </button>
            </div>
          </div>

        </div>
        <button id="btn-start-ai" class="btn btn-primary btn-full">Iniciar Partida</button>
      </div>

      <p id="lobby-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ========== TELA: AGUARDANDO ========== -->
  <div id="screen-waiting" class="screen">
    <div class="waiting-container">
      <div class="spinner"></div>
      <h2>Aguardando oponente...</h2>
      <p>Compartilhe o código da sala com seu amigo:</p>
      <div class="room-code-box">
        <span id="display-room-code">------</span>
        <button id="btn-copy" class="btn btn-small btn-secondary">Copiar</button>
      </div>
      <p id="copy-feedback" class="copy-feedback"></p>
      <button id="btn-cancel" class="btn btn-ghost">Cancelar</button>
    </div>
  </div>

  <!-- ========== TELA: JOGO ========== -->
  <div id="screen-game" class="screen">
    <div class="game-layout">

      <div class="game-sidebar left-sidebar">

        <div class="player-card" id="card-top">
          <div class="player-avatar" id="avatar-top">♟</div>
          <div class="player-info">
            <span class="player-label" id="label-top">Oponente</span>
            <div class="captured-pieces" id="captured-top"></div>
          </div>
        </div>

        <div class="move-history-box">
          <h3>Movimentos</h3>
          <div id="move-history" class="move-history"></div>
        </div>

        <div class="player-card" id="card-bottom">
          <div class="player-avatar" id="avatar-bottom">♙</div>
          <div class="player-info">
            <span class="player-label" id="label-bottom">Você</span>
            <div class="captured-pieces" id="captured-bottom"></div>
          </div>
        </div>

      </div>

      <div class="board-area">
        <div id="status-bar" class="status-bar">Conectando...</div>

        <div class="board-wrapper">
          <div class="coords-file" id="coords-file-top"></div>
          <div class="coords-rank" id="coords-rank-left"></div>
          <div id="chessboard" class="chessboard"></div>
          <div class="coords-rank" id="coords-rank-right"></div>
          <div class="coords-file" id="coords-file-bottom"></div>
        </div>

        <div class="game-controls">
          <button id="btn-resign"   class="btn btn-danger">Resignar</button>
          <button id="btn-new-game" class="btn btn-primary hidden">Nova Partida</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ========== MODAL: PROMOÇÃO ========== -->
  <div id="modal-promotion" class="modal hidden">
    <div class="modal-box">
      <h3>Promover peão</h3>
      <p>Escolha a peça:</p>
      <div class="promotion-choices" id="promotion-choices"></div>
    </div>
  </div>

  <!-- ========== MODAL: FIM DE JOGO ========== -->
  <div id="modal-gameover" class="modal hidden">
    <div class="modal-box">
      <div class="gameover-icon" id="gameover-icon">♛</div>
      <h2 id="gameover-title">Fim de Jogo</h2>
      <p id="gameover-msg"></p>
      <div class="gameover-actions">
        <button id="btn-gameover-new"   class="btn btn-primary">Jogar Novamente</button>
        <button id="btn-gameover-lobby" class="btn btn-ghost">Voltar ao Lobby</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/chess-engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
